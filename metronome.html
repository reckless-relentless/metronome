<html>
    <head>
        <title>Metronome</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width: device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Metronome</h1>
        <div id="bpm">
         <button id="minus">-</button>
         <p id="tempo">100</p>
         <button id="plus">+</button>
        </div>
        <h3>BPM</h3>
        <input id="slider" type="range" min="40" max="300" value="100"><br>
        <div id="buttons">
         <button id="start">Start</button>
         <button id="stop">Stop</button>
        </div>
        <p>
            This Metronome is still a work in progress so there are some few corners which needs to be polished so you might face some irregularities
         </p>
    <script>
        const slider=document.getElementById("slider");
        const tempo=document.getElementById("tempo");
        const start=document.getElementById("start");
        const stop=document.getElementById("stop");
        const minus=document.getElementById("minus");
        const plus=document.getElementById("plus");
        const clickSound = new Audio("click.mp3");
        let timer;
        function playClick()
        {
            clickSound.currentTime=0;
            clickSound.play();
        }
        start.addEventListener("click", function()
    {
       playClick();
       timer=setInterval(playClick, 60000 / Number(slider.value));
    });
        slider.addEventListener("input", function()
        {
            tempo.textContent = slider.value;
        });
    minus.addEventListener("click",function()
{
    slider.value=Number(slider.value)-1;
    tempo.textContent=slider.value;
});
    plus.addEventListener("click",function()
{
    slider.value=Number(slider.value)+1;
    tempo.textContent=slider.value;
})
stop.addEventListener("click",function()
{
    clearInterval(timer);
})
    </script>
    </body>

</html>
